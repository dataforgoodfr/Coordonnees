name: Run tests with uv

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: coordo-py

jobs:
  python-lint-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          working-directory: coordo-py
          activate-environment: true

      - name: Run linter
        run: uv run ruff check .

      - name: Run pytest
        run: uv run pytest
